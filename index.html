<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="極簡療癒風番茄鐘：自訂時間、YouTube 音樂、鈴聲提醒、自動明暗主題。">
<meta name="theme-color" content="#F7F3EE">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>療癒番茄鐘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=Huninn&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍅%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;--bgf:#F7F3EE;--bgs:#EEF4F0;--bgl:#EFF3F7;--acf:#E8A598;--acs:#9DBFA8;--acl:#9DB4CC;--fg:#5C534D;--fg2:#746A64;--on:#3A322D;--card:rgba(255,255,255,.55);--ring:clamp(200px,min(72vw,50dvh),340px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bgf:#2A2523;--bgs:#232A26;--bgl:#232830;--acf:#D98F82;--acs:#7FA38C;--acl:#8AA2BD;--fg:#E8E1DA;--fg2:#A79D95;--on:#221D1B;--card:rgba(255,255,255,.07)}}
:root[data-theme=dark]{--bgf:#2A2523;--bgs:#232A26;--bgl:#232830;--acf:#D98F82;--acs:#7FA38C;--acl:#8AA2BD;--fg:#E8E1DA;--fg2:#A79D95;--on:#221D1B;--card:rgba(255,255,255,.07)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
[data-phase=focus]{--bg:var(--bgf);--ac:var(--acf)}[data-phase=short]{--bg:var(--bgs);--ac:var(--acs)}[data-phase=long]{--bg:var(--bgl);--ac:var(--acl)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font:600 16px/1.5 "Iansui","Huninn","Hachi Maru Pop","Chalkboard SE","Comic Sans MS","PingFang TC","Microsoft JhengHei",sans-serif;transition:background .5s,color .5s}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:560px;margin:0 auto;display:grid;gap:24px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card)}
.tab{min-height:44px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--fg2);transition:background .3s}
.tab[aria-selected=true]{background:var(--ac);color:var(--on)}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:var(--card);font-size:18px}
.tools{display:flex;gap:8px}
.timer{display:grid;justify-items:center;gap:20px}
.ring{position:relative;width:var(--ring);height:var(--ring)}
svg{width:100%;height:100%;transform:rotate(-90deg)}
circle{fill:none;stroke-width:3;stroke-linecap:round}
.bg{stroke:var(--card)}.fgc{stroke:var(--ac);stroke-dasharray:289.03;transition:stroke-dashoffset .4s linear,stroke .5s}
.mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#time{font-size:calc(var(--ring)*.25);font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.1}
#sub{color:var(--fg2);font-size:15px}
.ctl{display:flex;align-items:center;gap:16px}
.go{min-width:132px;min-height:52px;border:0;border-radius:999px;background:var(--ac);color:var(--on);font-size:18px;transition:background .5s}
.sm{min-width:44px;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--card)}
.music{display:grid;gap:12px;padding:16px;border-radius:20px;background:var(--card)}
.row{display:flex;align-items:center;gap:8px}
input[type=url]{flex:1;min-width:0;min-height:44px;padding:0 14px;border:1px solid var(--card);border-radius:12px;background:var(--card)}
input[type=range]{flex:1;accent-color:var(--ac);min-height:44px}
#msg{margin:0;min-height:1.5em;font-size:14px;color:var(--fg2)}
.frame{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--card)}
.frame.off{height:0;aspect-ratio:auto}
.frame iframe{width:100%;height:100%;border:0}
.tip{text-align:center;color:var(--fg2);font-size:14px;margin:0}
.bd{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.28)}
.panel{position:fixed;z-index:5;left:0;right:0;bottom:0;max-height:85dvh;overflow:auto;padding:20px 20px max(20px,env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:var(--bg);box-shadow:0 -8px 32px rgba(0,0,0,.18)}
[hidden]{display:none!important}
.panel h2{margin:0 0 8px;font-size:18px;font-weight:500}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.f input[type=number]{width:72px;min-height:40px;padding:0 8px;border:1px solid var(--card);border-radius:10px;background:var(--card);text-align:center}
.f input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.f input[type=range]{max-width:160px}
@media(min-width:600px){.app{max-width:640px;--ring:clamp(240px,min(60vw,52dvh),380px)}.panel{left:auto;right:16px;top:72px;bottom:auto;width:340px;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.2)}.bd{background:none}}
@media(min-width:1025px){.app{max-width:960px;grid-template-columns:1fr 1fr;column-gap:48px;align-items:start}header{grid-column:1/-1}.timer{padding-top:16px}}
@media(max-height:500px) and (orientation:landscape){.app{max-width:none;grid-template-columns:1fr 1fr;align-items:center;--ring:min(64dvh,260px)}header{grid-column:1/-1}}
@media(hover:hover){.sm:hover,.ib:hover,.tab:hover{filter:brightness(.97)}.go:hover{filter:brightness(1.05)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="tabs" role="tablist">
  <button class="tab" role="tab" data-p="focus">專注</button>
  <button class="tab" role="tab" data-p="short">短休息</button>
  <button class="tab" role="tab" data-p="long">長休息</button>
 </div>
 <div class="tools">
  <button class="ib" id="th" type="button"></button>
  <button class="ib" id="st" type="button" aria-label="設定" aria-haspopup="dialog">⚙</button>
 </div>
</header>

<section class="timer" aria-label="計時器">
 <div class="ring">
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="fgc" id="arc" cx="50" cy="50" r="46"/></svg>
  <div class="mid"><div id="time" aria-live="off">25:00</div><div id="sub"></div></div>
 </div>
 <div class="ctl">
  <button class="sm" id="rs" type="button" aria-label="重設">重設</button>
  <button class="go" id="go" type="button">開始</button>
  <button class="sm" id="sk" type="button" aria-label="跳到下一階段">跳過</button>
 </div>
 <p class="tip">深呼吸，一次只做一件事 🍅</p>
</section>

<section class="music" aria-label="背景音樂">
 <div class="row"><input type="url" id="url" placeholder="貼上 YouTube／YouTube Music 影片、直播或播放清單連結" aria-label="YouTube 連結"><button class="sm" id="ld" type="button">載入</button></div>
 <p id="msg" role="status"></p>
 <div class="frame" id="fr"><div id="yt"></div></div>
 <div class="row">
  <button class="sm" id="mp" type="button">播放音樂</button>
  <button class="sm" id="mm" type="button">靜音</button>
  <button class="sm" id="mv2" type="button" aria-expanded="true">收合影片</button>
 </div>
 <div class="row"><span>音量</span><input type="range" id="mvol" min="0" max="100" value="60" aria-label="音樂音量"></div>
</section>
</div>

<div class="bd" id="bd" hidden></div>
<div class="panel" id="panel" role="dialog" aria-label="設定" hidden>
 <h2>設定</h2>
 <label class="f">專注（分鐘）<input type="number" id="cf" min="1" max="120"></label>
 <label class="f">短休息（分鐘）<input type="number" id="cs" min="1" max="120"></label>
 <label class="f">長休息（分鐘）<input type="number" id="cl" min="1" max="120"></label>
 <label class="f">長休息前的專注輪數<input type="number" id="cr" min="2" max="8"></label>
 <label class="f">階段結束後自動接續<input type="checkbox" id="ca"></label>
 <label class="f">音樂跟隨計時<input type="checkbox" id="cm"></label>
 <label class="f">鈴聲音量<input type="range" id="cb" min="0" max="100"></label>
 <div class="row"><button class="sm" id="tb" type="button">試聽鈴聲</button><button class="sm" id="df" type="button">還原預設值</button><button class="sm" id="cx" type="button">關閉</button></div>
</div>

<script>
const $=s=>document.querySelector(s),R=document.documentElement,C=289.03;
const DEF={f:25,s:5,l:15,r:4,auto:false,follow:true,bell:60};
const NAME={focus:'專注',short:'短休息',long:'長休息'},KEY={focus:'f',short:'s',long:'l'};
let cfg={...DEF},S={phase:'focus',round:1,left:25*60,run:false,end:0,fresh:true},actx,yt,mvol=60,mode=0;
const dur=p=>cfg[KEY[p]]*60;
const fmt=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

function render(){
 const t=dur(S.phase);
 $('#time').textContent=fmt(S.left);
 $('#arc').style.strokeDashoffset=C*(1-S.left/t);
 R.dataset.phase=S.phase;
 document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.p===S.phase));
 $('#sub').textContent=S.phase==='focus'?`第 ${S.round} / ${cfg.r} 輪`:'休息一下';
 $('#go').textContent=S.run?'暫停':(S.fresh?'開始':'繼續');
 document.title=`${fmt(S.left)} ${S.run?NAME[S.phase]+'中':'番茄鐘'}`;
 const bg=getComputedStyle(R).getPropertyValue('--bg').trim();
 if(bg)$('meta[name=theme-color]').content=bg;
}
function setPhase(p){S.phase=p;S.left=dur(p);S.run=false;S.fresh=true;musicPause();render()}
function nextPhase(){
 if(S.phase==='focus')setPhase(S.round>=cfg.r?'long':'short');
 else{S.round=S.phase==='long'?1:S.round+1;setPhase('focus')}
}
function start(){
 audio();S.run=true;S.fresh=false;S.end=Date.now()+S.left*1000;
 if(S.phase==='focus')musicPlay();render();
}
function pause(){S.left=Math.max(0,Math.ceil((S.end-Date.now())/1000));S.run=false;musicPause();render()}
function tick(){
 if(!S.run)return;
 S.left=Math.max(0,Math.ceil((S.end-Date.now())/1000));
 if(S.left<=0){const was=S.phase;musicPause();bell(was==='focus'?[880,1175,1568]:[659,523,440]);nextPhase();if(cfg.auto)start();return}
 render();
}
setInterval(tick,250);
document.addEventListener('visibilitychange',tick);

/* 鈴聲：Web Audio 合成 */
function audio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}
function bell(notes){
 try{audio();const v=cfg.bell/100*.4;
 notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.35;
  o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+1.8);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+1.9)})}catch(e){}
}

/* YouTube 音樂 */
function parse(u){
 u=u.trim();
 if(/^[\w-]{11}$/.test(u))return{id:u};
 try{
  const x=new URL(/^https?:/i.test(u)?u:'https://'+u),l=x.searchParams.get('list'),P=x.pathname.split('/').filter(Boolean);
  if(l&&!/^RD/.test(l)||l&&!x.searchParams.get('v'))return{list:l};
  let v=x.hostname==='youtu.be'?P[0]:x.searchParams.get('v');
  if(!v&&['live','shorts','embed','v'].includes(P[0]))v=P[1];
  if(v&&/^[\w-]{11}/.test(v))return{id:v.slice(0,11)}
 }catch(e){}
 return null
}
function msg(t){$('#msg').textContent=t}
function loadMusic(){
 const p=parse($('#url').value);
 if(!p){msg('無法辨識連結，請貼上 YouTube 影片或播放清單網址。');return}
 if(!/^https?:/.test(location.protocol)){msg('YouTube 不允許從本機檔案（file://）嵌入。請部署到 GitHub Pages，或用 http://localhost 開啟。');return}
 msg('載入中…');
 let done=false;
 const make=()=>{
  if(yt&&yt.destroy)yt.destroy();
  yt=null;
  $('#fr').innerHTML='<div id="yt"></div>';
  const pv={playsinline:1,origin:location.origin,widget_referrer:location.href};
  if(p.list){pv.listType='playlist';pv.list=p.list}
  yt=new YT.Player('yt',{width:'100%',height:'100%',videoId:p.id,playerVars:pv,events:{
   onReady:e=>{done=true;e.target.setVolume(mvol);msg('已載入。專注開始時會自動播放。');if(S.run&&S.phase==='focus')musicPlay()},
   onError:e=>{done=true;const c=e.data;msg(c===153||c===152?'播放器設定錯誤（'+c+'）：請確認網址是 https:// 開頭，且不是在預覽或沙盒環境中開啟。':c===101||c===150?'這個內容不允許嵌入播放（部分 YouTube Music 專屬曲目也會如此），請換一個連結。':c===2?'連結內容無效，請檢查影片或播放清單 ID。':'無法播放（錯誤 '+c+'），請換一個連結。')}}});
  setTimeout(()=>{if(!done)msg('載入逾時。播放清單需為公開或不公開列出，且網址須為 https://。')},10000);
 };
 if(window.YT&&YT.Player)make();
 else{window.onYouTubeIframeAPIReady=make;if(!document.getElementById('yta')){const s=document.createElement('script');s.id='yta';s.src='https://www.youtube.com/iframe_api';s.onerror=()=>msg('無法連線到 YouTube，請檢查網路。');document.head.appendChild(s)}}
}
const ok=()=>yt&&typeof yt.playVideo==='function';
function musicPlay(){if(cfg.follow&&ok())yt.playVideo()}
function musicPause(){if(cfg.follow&&ok())yt.pauseVideo()}

/* 主題：跟隨系統 → 淺色 → 深色 */
const MODES=[['auto','◐','跟隨系統'],['light','☀','淺色'],['dark','☾','深色']];
function theme(){
 const [m,i,n]=MODES[mode];
 m==='auto'?R.removeAttribute('data-theme'):R.setAttribute('data-theme',m);
 $('#th').textContent=i;$('#th').title=$('#th').ariaLabel=`主題：${n}，點擊切換為${MODES[(mode+1)%3][2]}`;
 render();
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);

/* 設定 */
function fillSettings(){
 $('#cf').value=cfg.f;$('#cs').value=cfg.s;$('#cl').value=cfg.l;$('#cr').value=cfg.r;
 $('#ca').checked=cfg.auto;$('#cm').checked=cfg.follow;$('#cb').value=cfg.bell;
}
const num=(id,k,a,b)=>{const v=Math.round(+$(id).value);if(v>=a&&v<=b)cfg[k]=v;$(id).value=cfg[k]};
function readSettings(){
 num('#cf','f',1,120);num('#cs','s',1,120);num('#cl','l',1,120);num('#cr','r',2,8);
 cfg.auto=$('#ca').checked;cfg.follow=$('#cm').checked;cfg.bell=+$('#cb').value;
 if(!S.run&&S.fresh)S.left=dur(S.phase);
 if(S.round>cfg.r)S.round=cfg.r;
 render();
}
function panel(open){$('#panel').hidden=$('#bd').hidden=!open;if(open)$('#cf').focus();else $('#st').focus()}

/* 事件 */
$('#go').onclick=()=>S.run?pause():start();
$('#rs').onclick=()=>setPhase(S.phase);
$('#sk').onclick=nextPhase;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setPhase(b.dataset.p));
$('#th').onclick=()=>{mode=(mode+1)%3;theme()};
$('#st').onclick=()=>panel(true);$('#cx').onclick=$('#bd').onclick=()=>panel(false);
$('#panel').addEventListener('input',readSettings);
$('#tb').onclick=()=>bell([880,1175,1568]);
$('#df').onclick=()=>{cfg={...DEF};mode=0;fillSettings();S.round=1;S.phase==='focus'||0;S.left=dur(S.phase);S.fresh=true;S.run=false;theme()};
$('#ld').onclick=loadMusic;
$('#url').addEventListener('keydown',e=>{if(e.key==='Enter')loadMusic()});
$('#mp').onclick=()=>{if(!ok()){msg('請先載入音樂連結。');return}const s=yt.getPlayerState();s===1?yt.pauseVideo():yt.playVideo();$('#mp').textContent=s===1?'播放音樂':'暫停音樂'};
$('#mm').onclick=()=>{if(!ok())return;const m=yt.isMuted();m?yt.unMute():yt.mute();$('#mm').textContent=m?'靜音':'取消靜音'};
$('#mvol').oninput=e=>{mvol=+e.target.value;if(ok())yt.setVolume(mvol)};
$('#mv2').onclick=()=>{const off=$('#fr').classList.toggle('off');$('#mv2').setAttribute('aria-expanded',!off);$('#mv2').textContent=off?'展開影片':'收合影片'};
document.addEventListener('keydown',e=>{
 if(e.target.closest('input,button')&&e.key===' ')return;
 if(e.target.matches('input'))return;
 if(e.key===' '){e.preventDefault();S.run?pause():start()}
 else if(e.key==='r'||e.key==='R')setPhase(S.phase);
 else if(e.key==='s'||e.key==='S')nextPhase();
 else if(e.key==='Escape'&&!$('#panel').hidden)panel(false);
});
if(innerWidth<600){$('#fr').classList.add('off');$('#mv2').textContent='展開影片';$('#mv2').setAttribute('aria-expanded','false')}
fillSettings();theme();
</script>
</body>
</html>
